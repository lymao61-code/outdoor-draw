<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>出门抽签</title>
<style>
  :root {
    --space-1: var(--kimi-space-1, 4px);
    --space-2: var(--kimi-space-2, 8px);
    --space-3: var(--kimi-space-3, 12px);
    --space-4: var(--kimi-space-4, 16px);
    --space-5: var(--kimi-space-5, 20px);
    --space-6: var(--kimi-space-6, 24px);
    --radius-panel: var(--kimi-radius-panel, 12px);
    --radius-chip: var(--kimi-radius-chip, 6px);
  }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--kimi-font-sans, sans-serif);
    color: var(--kimi-color-text-primary);
    background: transparent;
  }
  button, input, select, textarea { font: inherit; }
  svg text { font-family: var(--kimi-font-sans, sans-serif); }

  .wrap {
    width: 100%;
    max-width: 620px;
    padding-block-start: var(--space-4);
    padding-inline: var(--space-4);
    padding-block-end: var(--space-5);
  }

  /* 头部 */
  .head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-3); }
  .title { font-size: 20px; font-weight: 500; line-height: 28px; margin: 0; }
  .clock {
    font-size: 14px; color: var(--kimi-color-text-tertiary);
    font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1;
    white-space: nowrap;
  }
  .sub { font-size: 14px; color: var(--kimi-color-text-secondary); margin: var(--space-1) 0 0; }

  /* 控制区 */
  .controls { margin-block-start: var(--space-4); display: flex; flex-direction: column; gap: var(--space-3); }
  .control-row { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; }
  .control-label { font-size: 12px; color: var(--kimi-color-text-tertiary); min-width: 60px; }

  .chips { display: flex; gap: var(--space-2); flex-wrap: wrap; }

  /* 抽签按钮 */
  .draw-zone { margin-block-start: var(--space-5); display: flex; align-items: center; gap: var(--space-4); }
  .draw-btn {
    flex: 1;
    height: 52px;
    border-radius: var(--kimi-radius-button, 10px);
    border: none;
    background: var(--kimi-color-text-primary);
    color: var(--kimi-color-surface);
    font-size: 17px; font-weight: 500;
    cursor: pointer;
    transition: opacity var(--t-fast, 120ms) var(--ease-out, ease-out), transform var(--t-fast, 120ms) var(--ease-out, ease-out);
    display: flex; align-items: center; justify-content: center; gap: var(--space-2);
  }
  .draw-btn:hover { opacity: 0.88; }
  .draw-btn:active { transform: scale(0.985); }
  .draw-btn[disabled] { opacity: 0.5; cursor: default; pointer-events: none; }

  /* 结果卡 */
  .result {
    margin-block-start: var(--space-5);
    border: 1px solid var(--kimi-color-border);
    border-radius: var(--radius-panel);
    padding: var(--space-5);
    min-height: 132px;
    display: flex; flex-direction: column; justify-content: center; gap: var(--space-2);
    transition: border-color var(--t-fast, 120ms) ease-out;
  }
  .result.is-hit { border-color: var(--kimi-color-text-primary); }

  .result-empty {
    font-size: 14px; color: var(--kimi-color-text-tertiary);
    display: flex; align-items: center; gap: var(--space-2);
  }

  .draw-name {
    font-size: 26px; font-weight: 500; line-height: 1.2;
    letter-spacing: 0;
  }
  .draw-name.rolling { color: var(--kimi-color-text-tertiary); }

  .draw-tags { display: flex; gap: var(--space-2); flex-wrap: wrap; margin-block-start: var(--space-1); }
  .tag {
    font-size: 12px; line-height: 1;
    padding: 6px 10px;
    border-radius: var(--radius-chip);
    background: color-mix(in srgb, var(--kimi-color-text-primary) 7%, transparent);
    color: var(--kimi-color-text-secondary);
    display: inline-flex; align-items: center; gap: 6px;
  }
  .tag svg { display: block; }

  .draw-note { font-size: 14px; color: var(--kimi-color-text-secondary); margin-block-start: var(--space-1); line-height: 22px; }

  .result-actions { display: flex; gap: var(--space-2); margin-block-start: var(--space-3); }
  .redo { align-self: flex-start; }

  .foot {
    margin-block-start: var(--space-4);
    font-size: 12px; color: var(--kimi-color-text-quaternary);
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1 class="title">出门抽签</h1>
    <span class="clock" id="clock"></span>
  </div>
  <p class="sub">不知道出门做什么？交给签筒。</p>

  <div class="controls">
    <div class="control-row">
      <span class="control-label">窗外天气</span>
      <div class="chips kimi-segmented" id="weatherChips" role="group" aria-label="选择天气"></div>
    </div>
    <div class="control-row">
      <span class="control-label">愿意走多远</span>
      <div class="chips kimi-segmented" id="distChips" role="group" aria-label="选择距离"></div>
    </div>
  </div>

  <div class="draw-zone">
    <button class="draw-btn" id="drawBtn">
      <svg id="lotIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 2.5c2 2.4 3.2 5 3.2 7.6 0 1.7-1.3 3-3.2 3s-3.2-1.3-3.2-3C8.8 7.5 10 4.9 12 2.5z"/>
        <path d="M7.4 11.5c-1.7.9-3.4 2.7-3.4 5 0 3 3.6 5 8 5s8-2 8-5c0-2.3-1.7-4.1-3.4-5"/>
      </svg>
      <span id="drawLabel">摇一摇签筒</span>
    </button>
  </div>

  <div class="result" id="result" aria-live="polite">
    <div class="result-empty" id="emptyHint">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/>
      </svg>
      点上面按钮，抽一个今天出门的理由
    </div>
  </div>

  <p class="foot" id="foot"></p>
</div>

<script>
(function () {
  // ---------- 数据：活动签池 ----------
  // weather: sunny / cloudy / rainy / night ；dist: near / mid / far
  var POOL = [
    { name: "去公园长椅晒太阳，看半本书", w: "sunny", d: "near", dur: "1–2 小时", note: "带杯热饮，挑一棵顺眼的树坐下。" },
    { name: "骑行一条从没走过的路线", w: "sunny", d: "far", dur: "2–3 小时", note: "不看导航，拐弯凭心情，记得回家路。" },
    { name: "逛旧货市场或跳蚤市场", w: "sunny", d: "far", dur: "半天", note: "目标：淘到一件十块钱以内的小东西。" },
    { name: "沿江边或河边走一段", w: "sunny", d: "mid", dur: "1–2 小时", note: "走到有点累为止，中途不玩手机。" },
    { name: "找一家露天座位，坐够一小时", w: "sunny", d: "near", dur: "1 小时", note: "点一杯东西，专门用来发呆。" },
    { name: "拍一组「城市角落」照片", w: "sunny", d: "mid", dur: "1–2 小时", note: "主题自定：电线、猫、窗、影子，任选其一。" },
    { name: "去植物园或绿道慢慢走", w: "sunny", d: "far", dur: "2–3 小时", note: "看见不认识的植物就拍下来查名字。" },
    { name: "楼下草坪野餐（一个三明治也算）", w: "sunny", d: "near", dur: "1 小时", note: "重点是铺一张垫子躺着看天。" },
    { name: "慢跑 5 公里，不听歌", w: "sunny", d: "near", dur: "40 分钟", note: "听环境音：车、鸟、风声，都算数。" },
    { name: "放风筝，或者看别人放风筝", w: "sunny", d: "far", dur: "1–2 小时", note: "广场上总有人会放，站旁边看也很解压。" },
    { name: "去博物馆或美术馆泡一下午", w: "cloudy", d: "far", dur: "半天", note: "挑一个展厅认真看完，不赶进度。" },
    { name: "逛书店，买一本当场想读的书", w: "cloudy", d: "mid", dur: "1–2 小时", note: "在店里读完第一章再决定买不买。" },
    { name: "探索一条没走过的老街", w: "cloudy", d: "mid", dur: "1–2 小时", note: "阴天光线柔和，正适合慢慢逛和拍照。" },
    { name: "看一场下午场的电影", w: "cloudy", d: "mid", dur: "2 小时", note: "挑冷门片，冷门场次的体验最佳。" },
    { name: "去室内攀岩或打一场保龄球", w: "cloudy", d: "far", dur: "2 小时", note: "出点汗，阴天也值得说一句「今天没白过」。" },
    { name: "坐一趟公交到终点站再回来", w: "cloudy", d: "far", dur: "2 小时", note: "挑一条穿过市区的线路，靠窗坐。" },
    { name: "去花市，带一束花回家", w: "cloudy", d: "mid", dur: "1 小时", note: "花放在家里，阴天就跟你没关系了。" },
    { name: "撑伞走一条最熟悉的路", w: "rainy", d: "near", dur: "40 分钟", note: "雨天是这座城市最安静的样子。" },
    { name: "找家咖啡馆坐窗边，写点什么", w: "rainy", d: "near", dur: "1–2 小时", note: "写什么都行，写两行也算。" },
    { name: "逛超市，认真挑今晚的食材", w: "rainy", d: "near", dur: "1 小时", note: "下雨天逛超市是被低估的治愈活动。" },
    { name: "去室内泳池游 1000 米", w: "rainy", d: "far", dur: "1–2 小时", note: "反正都要湿，雨就随它下。" },
    { name: "去夜市从头吃到尾", w: "night", d: "far", dur: "2 小时", note: "预算自定，目标是吃到三样没见过的东西。" },
    { name: "夜跑 3 公里，走回来", w: "night", d: "near", dur: "40 分钟", note: "跑完吹着风走回家，一天圆满结束。" },
    { name: "去高处看城市夜景", w: "night", d: "mid", dur: "1 小时", note: "天桥、 rooftops 观景台，哪高去哪。" },
    { name: "看一场晚间演出或 Livehouse", w: "night", d: "far", dur: "2–3 小时", note: "提前一天查好场次，给夜晚一个期待。" },
    { name: "楼下散步 20 分钟，看月亮", w: "night", d: "near", dur: "20 分钟", note: "月亮不在也算，星空偶尔旷工。" }
  ];

  var WEATHERS = [
    { key: "sunny", label: "晴" },
    { key: "cloudy", label: "多云" },
    { key: "rainy", label: "雨" },
    { key: "night", label: "夜晚" }
  ];
  var DISTS = [
    { key: "near", label: "出门就行" },
    { key: "mid", label: "附近走走" },
    { key: "far", label: "特意去一趟" }
  ];

  // ---------- 状态 ----------
  var state = { weather: "sunny", dist: "mid" };
  var rolling = false;
  var lastPick = null;

  // ---------- 时段问候 ----------
  function period() {
    var h = new Date().getHours();
    if (h >= 5 && h < 9) return "清晨";
    if (h >= 9 && h < 12) return "上午";
    if (h >= 12 && h < 14) return "中午";
    if (h >= 14 && h < 18) return "下午";
    if (h >= 18 && h < 22) return "傍晚";
    return "夜里";
  }
  function defaultWeather() {
    var h = new Date().getHours();
    if (h >= 19 || h < 5) return "night";
    return "sunny";
  }

  // ---------- 时钟 ----------
  var clockEl = document.getElementById("clock");
  function tickClock() {
    var now = new Date();
    var hh = String(now.getHours()).padStart(2, "0");
    var mm = String(now.getMinutes()).padStart(2, "0");
    clockEl.textContent = period() + " " + hh + ":" + mm;
  }
  tickClock();
  setInterval(tickClock, 20000);

  // ---------- chips ----------
  function buildChips(containerId, items, key) {
    var box = document.getElementById(containerId);
    box.innerHTML = "";
    items.forEach(function (it) {
      var b = document.createElement("button");
      b.className = "kimi-chip";
      b.type = "button";
      b.textContent = it.label;
      b.setAttribute("aria-pressed", String(state[key] === it.key));
      b.addEventListener("click", function () {
        state[key] = it.key;
        box.querySelectorAll(".kimi-chip").forEach(function (c) {
          c.setAttribute("aria-pressed", "false");
        });
        b.setAttribute("aria-pressed", "true");
        updateFoot();
      });
      box.appendChild(b);
    });
  }

  var footEl = document.getElementById("foot");
  function poolFor() {
    var p = POOL.filter(function (a) { return a.w === state.weather && a.d === state.dist; });
    if (p.length) return p;
    p = POOL.filter(function (a) { return a.w === state.weather; });
    if (p.length) return p;
    return POOL;
  }
  function updateFoot() {
    var n = poolFor().length;
    footEl.textContent = "当前组合下有 " + n + " 支签 · 天气为手动选择，以窗外为准";
  }

  // ---------- 抽签动画 ----------
  var resultEl = document.getElementById("result");
  var drawBtn = document.getElementById("drawBtn");
  var drawLabel = document.getElementById("drawLabel");

  function renderPick(pick) {
    var icon = {
      sunny: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/></svg>',
      cloudy: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="9" r="3.4"/><path d="M9 3.2v1.4M3.2 9h1.4M4.9 4.9l1 1"/><path d="M8 18.5h8.5a3.5 3.5 0 0 0 .6-6.95A5 5 0 0 0 7.4 13 3 3 0 0 0 8 18.5z"/></svg>',
      rainy: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 15h10a3.5 3.5 0 0 0 .6-6.95A5 5 0 0 0 7.4 9.5 3 3 0 0 0 7 15z"/><path d="M8.5 17.5 8 20M12.5 17.5 12 20M16.5 17.5 16 20"/></svg>',
      night: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>'
    }[pick.w];
    var wLabel = { sunny: "晴天适配", cloudy: "阴天适配", rainy: "雨天适配", night: "夜晚适配" }[pick.w];
    var dLabel = { near: "出门就行", mid: "附近走走", far: "特意去一趟" }[pick.d];

    resultEl.classList.add("is-hit");
    resultEl.innerHTML =
      '<div class="draw-name">' + pick.name + '</div>' +
      '<div class="draw-tags">' +
        '<span class="tag">' + icon + wLabel + '</span>' +
        '<span class="tag">' + dLabel + '</span>' +
        '<span class="tag">' + pick.dur + '</span>' +
      '</div>' +
      '<div class="draw-note">' + pick.note + '</div>' +
      '<div class="result-actions">' +
        '<button class="kimi-button kimi-button--secondary redo" id="redoBtn" type="button">再抽一次</button>' +
      '</div>';
    document.getElementById("redoBtn").addEventListener("click", draw);
  }

  function draw() {
    if (rolling) return;
    rolling = true;
    drawBtn.disabled = true;
    drawLabel.textContent = "摇签中…";

    var pool = poolFor();
    var candidates = pool.filter(function (a) { return a !== lastPick; });
    if (!candidates.length) candidates = pool;
    var pick = candidates[Math.floor(Math.random() * candidates.length)];
    lastPick = pick;

    // 老虎机滚动：先快速闪，再减速落签
    resultEl.classList.remove("is-hit");
    var steps = 14;
    var i = 0;
    function step() {
      var a = pool[Math.floor(Math.random() * pool.length)];
      resultEl.innerHTML = '<div class="draw-name rolling">' + a.name + '</div>';
      i++;
      if (i < steps) {
        setTimeout(step, 40 + i * i * 1.6);
      } else {
        renderPick(pick);
        rolling = false;
        drawBtn.disabled = false;
        drawLabel.textContent = "再摇一次";
      }
    }
    step();
  }

  // ---------- 初始化 ----------
  state.weather = defaultWeather();
  buildChips("weatherChips", WEATHERS, "weather");
  buildChips("distChips", DISTS, "dist");
  updateFoot();
  drawBtn.addEventListener("click", draw);
})();
</script>
</body>
</html>
